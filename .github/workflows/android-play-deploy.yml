name: Android Play deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain Android version matching protected main
        required: true
        type: string
      commit_edit:
        description: Commit the validated edit to Play internal testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-play-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  internal-testing:
    name: Validate or publish Play internal-testing bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: android-play-internal
    permissions:
      attestations: write
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact protected-main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify version and completed source CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$REQUESTED_VERSION" = "$package_version" || {
            echo "Requested Android version $REQUESTED_VERSION does not match package version $package_version." >&2
            exit 1
          }
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "Desktop, Android, lint, and release-script gates")] | sort_by(.completed_at) | last | .conclusion // empty')"
          test "$conclusion" = "success" || {
            echo "Required source CI has not passed for $GITHUB_SHA (conclusion: ${conclusion:-missing})." >&2
            exit 1
          }

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned npm dependencies
        run: npm ci

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Materialize protected signing and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not configured." >&2; exit 1; }
          test -n "$SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured." >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/serialslinger-upload.jks"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          chmod 600 "$RUNNER_TEMP/serialslinger-upload.jks" "$RUNNER_TEMP/google-play-service-account.json"

      - name: Build and verify the Play-upload-signed bundle
        env:
          SERIALSLINGER_UPLOAD_STORE_FILE: ${{ runner.temp }}/serialslinger-upload.jks
          SERIALSLINGER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SERIALSLINGER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SERIALSLINGER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./scripts/build-signed-bundle.sh

      - name: Verify the built bundle identity and native compatibility
        run: |
          node scripts/check-android-native-compatibility.mjs \
            androidApp/build/outputs/bundle/release/androidApp-release.aab \
            --expected-version "${{ inputs.version }}" \
            --expected-package com.SerialSlinger.openardf

      - name: Attest the signed Android bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Validate or commit the Play internal-testing edit
        run: |
          node scripts/publish-google-play-internal.mjs \
            --bundle androidApp/build/outputs/bundle/release/androidApp-release.aab \
            --service-account "$RUNNER_TEMP/google-play-service-account.json" \
            --package-name com.SerialSlinger.openardf \
            --version "${{ inputs.version }}" \
            --release-notes "docs/release-notes/v${{ inputs.version }}.md" \
            --commit "${{ inputs.commit_edit }}"

      - name: Preserve the signed bundle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serialslinger-${{ inputs.version }}-play-bundle
          if-no-files-found: error
          retention-days: 14
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/serialslinger-upload.jks" "$RUNNER_TEMP/google-play-service-account.json"
