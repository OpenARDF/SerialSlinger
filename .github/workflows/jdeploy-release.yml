name: jDeploy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain release version matching protected main, for example 2.2.0
        required: true
        type: string
      publish:
        description: Create the tag and public release after the protected approval gate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jdeploy-release-${{ github.repository }}
  cancel-in-progress: false

env:
  SERIALSLINGER_RELEASE_VERSION: ${{ inputs.version }}
  SERIALSLINGER_RELEASE_TAG: v${{ inputs.version }}
  SERIALSLINGER_RELEASE_COMMIT: ${{ github.sha }}
  SERIALSLINGER_RELEASE_WORKFLOW: "1"
  SERIALSLINGER_RELEASE_DRY_RUN: ${{ inputs.publish != true && '1' || '0' }}

jobs:
  prepare-release:
    name: Prepare and prove final release assets
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact protected-main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify the release request and completed source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-request.mjs
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "Desktop, Android, lint, and release-script gates")] | sort_by(.completed_at) | last | .conclusion // empty')"
          test "$conclusion" = "success" || {
            echo "Required source CI has not passed for $GITHUB_SHA (conclusion: ${conclusion:-missing})." >&2
            exit 1
          }

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned package dependencies
        run: npm ci

      - name: Build and verify the desktop release payload
        run: npm run jdeploy:release-preflight

      - name: Prepare final installer assets locally
        env:
          GH_TOKEN: ${{ github.token }}
          JDEPLOY_REGISTRY_URL: https://www.jdeploy.com/
        run: |
          node scripts/prepare-jdeploy-github-release.mjs
          ./scripts/prepare-jdeploy-macos-installers.sh jdeploy/github-release-files
          node --test scripts/prepare-jdeploy-macos-installers.test.mjs
          npm pack --ignore-scripts --pack-destination jdeploy/github-release-files

      - name: Create and verify immutable release evidence
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/release-manifest.mjs create \
            --directory jdeploy/github-release-files \
            --version "$SERIALSLINGER_RELEASE_VERSION" \
            --tag "$SERIALSLINGER_RELEASE_TAG" \
            --source-commit "$SERIALSLINGER_RELEASE_COMMIT" \
            --workflow-url "$WORKFLOW_URL"
          node scripts/release-manifest.mjs verify --directory jdeploy/github-release-files

      - name: Attest final release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: jdeploy/github-release-files/*

      - name: Preserve the proven release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serialslinger-${{ inputs.version }}-release
          if-no-files-found: error
          retention-days: 14
          path: jdeploy/github-release-files/*

      - name: Report dry-run result
        if: inputs.publish != true
        run: echo "Release assets passed the complete dry run; no tag, release, or moving metadata was changed." >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Approve and publish proven release assets
    if: inputs.publish == true
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact proven commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download the exact proven payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: serialslinger-${{ inputs.version }}-release
          path: release-files

      - name: Reverify the transferred payload
        run: node scripts/release-manifest.mjs verify --directory release-files

      - name: Create tag, upload once, read back, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SERIALSLINGER_ALLOW_GITHUB_RELEASE_PUBLISH: "1"
        run: ./scripts/publish-github-release.sh release-files

      - name: Update moving jDeploy metadata last
        env:
          GH_TOKEN: ${{ github.token }}
          SERIALSLINGER_ALLOW_GITHUB_RELEASE_PUBLISH: "1"
        run: ./scripts/update-jdeploy-metadata.sh release-files
