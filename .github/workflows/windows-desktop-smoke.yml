name: Windows x64 installed desktop smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main, Development_Android]
    paths:
      - ".github/workflows/windows-desktop-smoke.yml"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "package-lock.json"
      - "package.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle.kts"
      - "shared/**"
  push:
    branches: [Development_Android]
    paths:
      - ".github/workflows/windows-desktop-smoke.yml"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "package-lock.json"
      - "package.json"
      - "scripts/jdeploy-*.mjs"
      - "settings.gradle.kts"
      - "shared/**"

permissions:
  contents: read

concurrency:
  group: windows-desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-smoke:
    name: Install and probe the jDeploy app
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install and probe SerialSlinger through jDeploy
        run: npm run jdeploy:local-smoke
      - name: Stop Gradle before saving the setup cache
        if: always()
        run: .\gradlew.bat --stop
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-installed-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.APPDATA }}\SerialSlinger\logs\**
            shared\build\reports\**
